<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>进入私人学习站</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16251f;
        --muted: #64736c;
        --line: rgba(33, 72, 58, 0.16);
        --paper: rgba(252, 253, 248, 0.9);
        --accent: #1d6a50;
        --accent-deep: #124634;
        --error: #a4382b;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 10%, rgba(166, 205, 184, 0.52), transparent 34%),
          radial-gradient(circle at 88% 82%, rgba(226, 195, 131, 0.3), transparent 34%),
          linear-gradient(145deg, #edf4ec 0%, #f7f4e8 52%, #e8f0ec 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 440px);
        padding: clamp(28px, 6vw, 42px);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 28px;
        background: var(--paper);
        box-shadow: 0 24px 70px rgba(32, 63, 50, 0.16);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 11em;
        font-family: Georgia, "Songti SC", "STSong", serif;
        font-size: clamp(30px, 8vw, 42px);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }

      .intro {
        margin: 16px 0 30px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      label {
        display: block;
        margin-bottom: 9px;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 52px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0 15px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.86);
        font: inherit;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(29, 106, 80, 0.12);
      }

      button {
        width: 100%;
        min-height: 52px;
        margin-top: 14px;
        border: 0;
        border-radius: 14px;
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent-deep));
        box-shadow: 0 10px 24px rgba(18, 70, 52, 0.2);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        transition: transform 150ms ease, opacity 150ms ease;
      }

      button:hover { transform: translateY(-1px); }
      button:focus-visible { outline: 3px solid rgba(29, 106, 80, 0.28); outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: 0.68; transform: none; }

      #status {
        min-height: 23px;
        margin: 12px 2px 0;
        color: var(--error);
        font-size: 13px;
        line-height: 1.55;
      }

      .privacy {
        margin: 20px 0 0;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <p class="eyebrow">Gaoyouyang · Course Hub</p>
      <h1 id="page-title">进入私人学习站</h1>
      <p class="intro">请输入访问密码。验证成功后，本浏览器即可打开课程、课件、作业与学习记录。</p>

      <form id="access-form" method="post" action="/api/v1/session" novalidate>
        <label for="password">访问密码</label>
        <input
          id="password"
          name="token"
          type="password"
          autocomplete="current-password"
          required
          autofocus
          aria-describedby="status"
        />
        <button id="submit-button" type="submit">进入学习站</button>
        <p id="status" role="alert" aria-live="polite"></p>
      </form>

      <noscript><p id="status">请启用 JavaScript 后再验证密码。</p></noscript>

      <p class="privacy">密码只用于本次加密验证，不会写入网页、网址或浏览器本地存储。</p>
    </main>

    <script>
      (() => {
        "use strict";

        const form = document.querySelector("#access-form");
        const input = document.querySelector("#password");
        const button = document.querySelector("#submit-button");
        const status = document.querySelector("#status");

        function safeDestination() {
          const candidate = new URLSearchParams(window.location.search).get("next") || "/";
          if (/[\u0000-\u0020\u007f]/.test(candidate) || candidate.includes("\\")) {
            return "/";
          }
          try {
            const destination = new URL(candidate, window.location.origin);
            if (
              destination.origin !== window.location.origin ||
              destination.username ||
              destination.password ||
              destination.pathname === "/access" ||
              destination.pathname.startsWith("/access/")
            ) {
              return "/";
            }
            return `${destination.pathname}${destination.search}${destination.hash}`;
          } catch (_) {
            return "/";
          }
        }

        async function resumeExistingSession() {
          try {
            const response = await fetch("/api/v1/session", {
              credentials: "same-origin",
              headers: { Accept: "application/json" },
            });
            if (response.ok) window.location.replace(safeDestination());
          } catch (_) {
            // The submit path below will surface a useful network error.
          }
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          status.textContent = "";
          if (!input.value) {
            status.textContent = "请输入访问密码。";
            input.focus();
            return;
          }

          button.disabled = true;
          button.textContent = "正在验证…";
          let suppliedPassword = input.value;
          let requestBody = JSON.stringify({ token: suppliedPassword });
          suppliedPassword = "";
          input.value = "";

          try {
            const pendingResponse = fetch("/api/v1/session", {
              method: "POST",
              credentials: "same-origin",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: requestBody,
            });
            requestBody = "";
            const response = await pendingResponse;

            if (response.ok) {
              window.location.replace(safeDestination());
              return;
            }
            if (response.status === 401) {
              status.textContent = "密码不正确，请重新输入。";
            } else if (response.status === 429) {
              status.textContent = "尝试次数过多，请稍后再试。";
            } else {
              status.textContent = "暂时无法验证，请稍后重试。";
            }
          } catch (_) {
            suppliedPassword = "";
            requestBody = "";
            input.value = "";
            status.textContent = "无法连接到服务器，请检查网络后重试。";
          } finally {
            button.disabled = false;
            button.textContent = "进入学习站";
            if (!status.textContent) return;
            input.focus();
          }
        });

        resumeExistingSession();
      })();
    </script>
  </body>
</html>
