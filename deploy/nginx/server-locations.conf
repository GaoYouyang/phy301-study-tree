# Included inside the HTTP/IP and HTTPS domain server blocks.
root /srv/learning-hub/hub/current;
index index.html;
charset utf-8;
autoindex off;
etag on;
server_tokens off;

# The whole site is private. Nginx asks the loopback API whether the browser
# has a valid HttpOnly session before serving hub/course/download content.
# The login page and session-creation endpoint opt out below.
satisfy any;
allow 127.0.0.1;
allow ::1;
deny all;
auth_request /_course_site_auth;
error_page 401 = @private_login;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location = /_course_site_auth {
    internal;
    allow all;
    auth_request off;
    proxy_pass http://127.0.0.1:8787/api/v1/session;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @private_login {
    allow all;
    auth_request off;
    return 302 /access/?next=$uri;
}

location @private_api_unauthorized {
    allow all;
    auth_request off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 401 '{"error":{"code":"unauthorized","message":"Authentication required."}}';
}

location = /access {
    allow all;
    auth_request off;
    return 308 /access/;
}

location = /access/ {
    allow all;
    auth_request off;
    root /srv/learning-hub/hub/current;
    try_files /access/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /healthz {
    access_log off;
    default_type text/plain;
    # Use the normal content phase so the origin-wide auth_request above runs.
    # A rewrite-phase `return 200` here would accidentally bypass the gate.
    try_files /healthz =404;
}

# The shared four-course hub owns the root. Until it exists, retain the
# temporary route into the legacy PHY301 GitHub Pages export.
location = / {
    try_files /index.html @legacy_phy301;
}

location @legacy_phy301 {
    return 302 /phy301-study-tree/;
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
}

location = /phy301-study-tree {
    return 308 /phy301-study-tree/;
}

location ^~ /phy301-study-tree/_next/static/ {
    root /srv/learning-hub/courses/phy301/current;
    try_files $uri =404;
    expires 1y;
    access_log off;
}

location ^~ /phy301-study-tree/ {
    root /srv/learning-hub/courses/phy301/current;
    error_page 401 = @private_login;
    error_page 404 /phy301-study-tree/404.html;
    try_files $uri $uri/ $uri/index.html =404;
}

location = /phy301-study-tree/404.html {
    root /srv/learning-hub/courses/phy301/current;
    internal;
}

# Stable course prefixes. PHY301 currently ships with its historic
# /phy301-study-tree/ base path. Serve a future native /phy301/ package as soon
# as it exists; until then, keep the hub's stable PHY301 link useful.
location = /phy301 {
    return 308 /phy301/;
}

location = /phy301/ {
    root /srv/learning-hub/courses/phy301/current;
    try_files /phy301/index.html @legacy_phy301_stable;
}

location @legacy_phy301_stable {
    return 308 /phy301-study-tree/;
}

location ^~ /phy301/ {
    root /srv/learning-hub/courses/phy301/current;
    try_files $uri $uri/ $uri/index.html =404;
}

location ^~ /phy408/ {
    root /srv/learning-hub/courses/phy408/current;
    try_files $uri $uri/ $uri/index.html =404;
}

location ^~ /phy309/ {
    root /srv/learning-hub/courses/phy309/current;
    try_files $uri $uri/ $uri/index.html =404;
}

location ^~ /mat107/ {
    root /srv/learning-hub/courses/mat107/current;
    try_files $uri $uri/ $uri/index.html =404;
}

# Local services add narrowly scoped route files here.
include /etc/nginx/phy301/locations-enabled/*.conf;
