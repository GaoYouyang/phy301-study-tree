# TLS-aware template used only after bootstrap-ubuntu.sh verifies every
# referenced Certbot artifact exists.
server {
    listen 80;
    listen [::]:80;
    server_name gaoyouyang.site www.gaoyouyang.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Never accept credentials over the public IP's plaintext HTTP endpoint.
server {
    listen 80;
    listen [::]:80;
    server_name 150.109.55.123 localhost 127.0.0.1;

    return 301 https://gaoyouyang.site$request_uri;
}

# Deployment and health checks use a loopback-only listener. It is not
# reachable from the public network and therefore cannot leak a password.
server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name localhost 127.0.0.1;

    include /etc/nginx/phy301/server-locations.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gaoyouyang.site www.gaoyouyang.site;

    ssl_certificate /etc/letsencrypt/live/gaoyouyang.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaoyouyang.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/phy301/server-locations.conf;
}
