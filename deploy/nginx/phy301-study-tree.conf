# HTTP-only bootstrap template. It deliberately serves no course/login page
# publicly until TLS exists; Certbot's ACME challenge remains available.
server {
    listen 80;
    listen [::]:80;
    server_name gaoyouyang.site www.gaoyouyang.site 150.109.55.123;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS setup is not complete.\n";
    }
}

server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name localhost 127.0.0.1;

    include /etc/nginx/phy301/server-locations.conf;
}
